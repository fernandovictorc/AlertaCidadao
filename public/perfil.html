<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Denúncias - Alerta Cidadão</title>
  <link rel="stylesheet" href="assets/css/agnostico.css">
  <link rel="stylesheet" href="assets/css/projeto.css">
  <script src="js/auth.js"></script>
  <script>protectRoute();</script>
</head>
<body>
  <header class="header">
    <div class="container header-content">
      <a href="index.html" class="logo">
        <div class="logo-icon">A</div>
        Alerta Cidadão
      </a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Início</a>
        <a href="nova-denuncia.html" class="nav-link">Nova Denúncia</a>
      </nav>
    </div>
  </header>
  <main class="container">
    <section class="section-title">
      <h1>Minhas denúncias</h1>
      <p id="profile-greeting"></p>
      <a href="nova-denuncia.html" class="btn-primary">Criar denúncia</a>
    </section>
    <div class="feed-container d--flex flex--dir--column gap--md" data-feed="mine" aria-live="polite">
      <p>Carregando suas denúncias...</p>
    </div>
  </main>
  <script src="js/ui.js"></script>
  <script type="module" src="js/feed.js"></script>
  <script>
    const user = getUser();
    document.getElementById('profile-greeting').textContent = user ? `Olá, ${user.nome}. Aqui você pode acompanhar, editar ou excluir suas denúncias.` : '';
  </script>
</body>
</html>
