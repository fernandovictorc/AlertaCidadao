<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alerta Cidadão - Em Andamento</title>
  <link rel="stylesheet" href="assets/css/agnostico.css">
  <link rel="stylesheet" href="assets/css/projeto.css">
</head>
<body>
  <!-- Cabeçalho (Header) -->
  <header class="header">
    <div class="container header-content">
      <a href="index.html" class="logo">
        <div class="logo-icon">A</div>
        Alerta Cidadão
      </a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Início</a>
        <a href="nova-denuncia.html" class="nav-link">Nova Denúncia</a>
        <a href="login.html" class="btn-primary" style="display: inline-block; text-align: center; text-decoration: none;">Entrar</a>
      </nav>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="container">
    <div class="tabs d--flex gap--lg">
      <a href="index.html" class="tab-link">Trending Topics</a>
      <a href="em-andamento.html" class="tab-link active">Em Andamento</a>
      <a href="concluidas.html" class="tab-link">Obras Concluídas</a>
    </div>

    <!-- Feed de Denúncias -->
    <div class="feed-container d--flex flex--dir--column gap--md">
      
      <!-- Card 1 -->
      <article class="product-card">
        <img src="assets/images/buraco_rua.jpg" alt="Obra de recapeamento" class="product-card-thumbnail" style="background-color: var(--color--bg--muted);">
        <div class="product-card-content">
          <a href="denuncia-detalhes.html" style="color: inherit; text-decoration: none;"><h3>Recapeamento da Avenida Central</h3></a>
          <p>Equipes da prefeitura iniciaram os reparos no asfalto. Previsão de término em 2 dias.</p>
          <div class="meta-info">
            <span class="tag" style="background-color: var(--color--brand--aqua); color: #fff;">Em Obra</span>
            <span class="tag">Infraestrutura</span>
            <span class="tag">Centro</span>
            <div class="comment-count">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
              45 comentários
            </div>
          </div>
        </div>
        <button class="product-card-action">
          <svg class="upvote-icon" viewBox="0 0 10 10"><path d="M5 1L10 8H0Z"></path></svg>
          <span>512</span>
        </button>
      </article>

    </div>
  </main>
</body>
</html>
