<!DOCTYPE html>

<body>
  <!-- Cabeçalho (Header) -->
  <header class="header">
    <div class="container header-content">

        Alerta Cidadão

  <!-- Conteúdo Principal -->
  <main class="container">
    <div class="tabs d--flex gap--lg">

    <div class="feed-container d--flex flex--dir--column gap--md">
      
      <!-- Card 1 -->
      <article class="product-card" style="opacity: 0.8;">
        <img src="assets/images/poste_apagado.jpg" alt="Poste consertado" class="product-card-thumbnail" style="background-color: var(--color--bg--muted);">

          <a href="denuncia-detalhes.html" style="color: inherit; text-decoration: none;"><h3>Troca de lâmpada no Bairro das Flores</h3></a>

          <div class="meta-info">
            <span class="tag" style="background-color: var(--color--feedback--success); color: #fff;">Concluído</span>
            <span class="tag">Iluminação</span>
            <span class="tag">Flores</span>
            <div class="comment-count">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
