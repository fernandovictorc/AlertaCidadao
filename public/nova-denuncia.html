<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Denúncia - Alerta Cidadão</title>
  <link rel="stylesheet" href="assets/css/agnostico.css">
  <link rel="stylesheet" href="assets/css/projeto.css">
  <script src="js/auth.js"></script>
  <script>protectRoute();</script>
</head>
<body>
  <!-- Cabeçalho (Header) -->
  <header class="header">
    <div class="container header-content">
      <a href="index.html" class="logo">
        <div class="logo-icon">A</div>
        Alerta Cidadão
      </a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Início</a>
        <a href="nova-denuncia.html" class="nav-link" style="color: var(--color--text--main); font-weight: var(--font--weight--semibold);">Nova Denúncia</a>
        <a href="login.html" class="btn-primary" style="display: inline-block; text-align: center; text-decoration: none;">Entrar</a>
      </nav>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="container">
    <div class="form-container form-container-lg">
      <div class="form-header">
        <h2>Reportar um Problema</h2>
        <p>Preencha os detalhes para que o órgão responsável possa agir.</p>
      </div>

      <form action="#" method="POST">
        
        <div class="form-group">
          <label for="titulo" class="form-label">Título da Denúncia</label>
          <input type="text" id="titulo" name="titulo" class="form-input" placeholder="Ex: Buraco perigoso na via" required>
        </div>

        <div class="form-group">
          <label for="descricao" class="form-label">Descrição detalhada</label>
          <textarea id="descricao" name="descricao" class="form-textarea" placeholder="Descreva o problema com o máximo de detalhes..." required></textarea>
        </div>

        <div class="d--flex flex--wrap--wrap gap--md">
          <div class="form-group flex--1">
            <label for="endereco" class="form-label">Endereço</label>
            <input type="text" id="endereco" name="endereco" class="form-input" placeholder="Rua, Avenida..." required>
          </div>
          <div class="form-group flex--1">
            <label for="bairro" class="form-label">Bairro</label>
            <input type="text" id="bairro" name="bairro" class="form-input" placeholder="Nome do bairro" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Anexos de Mídia (Máx. 2 fotos e 1 vídeo, 10MB)</label>
          <input type="file" id="midia" name="midia" class="form-input" accept="image/*,video/*" multiple>
          <small style="color: var(--color--text--muted); font-size: 12px;">Selecione os arquivos comprobatórios para ajudar na análise.</small>
        </div>

        <div class="form-group">
          <label for="notificacao" class="form-label">Preferência de Notificações</label>
          <select id="notificacao" name="notificacao" class="form-select">
            <option value="whatsapp">WhatsApp</option>
            <option value="email">E-mail</option>
            <option value="none">Não receber notificações</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Controles de Privacidade</label>
          <label class="form-checkbox">
            <input type="checkbox" name="anonimo">
            <span><strong>Denúncia Anônima:</strong> Ocultar meu nome e foto na postagem pública.</span>
          </label>
          <label class="form-checkbox">
            <input type="checkbox" name="privada">
            <span><strong>Denúncia Privada:</strong> Ocultar do feed social (visível apenas para o órgão público).</span>
          </label>
        </div>

        <button type="submit" class="btn-primary btn-block" style="margin-top: var(--space--xl);">Enviar Denúncia</button>
      </form>
    </div>
  </main>
  
  <script src="js/ui.js"></script>
  <script type="module">
    import { postDenuncia } from './js/api.js';

    document.addEventListener('DOMContentLoaded', () => {
      updateHeaderAuthUI();
    });

    document.querySelector('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const titulo = document.getElementById('titulo').value;
      const descricao = document.getElementById('descricao').value;
      const endereco = document.getElementById('endereco').value;
      const bairro = document.getElementById('bairro').value;
      const notificacao = document.getElementById('notificacao').value;
      
      const anonimo = document.querySelector('input[name="anonimo"]').checked;
      const privado = document.querySelector('input[name="privada"]').checked;

      const midias = [];
      const files = document.getElementById('midia').files;
      if (files.length > 0) {
        const file = files[0];
        const reader = new FileReader();
        reader.onloadend = async () => {
          midias.push({ tipo: file.type.includes('video') ? 'video' : 'foto', url_ou_base64: reader.result });
          await submitData();
        };
        reader.readAsDataURL(file);
      } else {
        await submitData();
      }

      async function submitData() {
        const submitBtn = document.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerText;
        submitBtn.disabled = true;
        submitBtn.innerText = 'Enviando...';
        try {
          await postDenuncia({
            titulo, descricao, morada: endereco, bairro, notificacao_pref: notificacao,
            anonimo, privado, midias
          });
          alert('Denúncia enviada com sucesso!');
          window.location.href = 'index.html';
        } catch (error) {
          alert('Erro ao enviar denúncia: ' + error.message);
          submitBtn.disabled = false;
          submitBtn.innerText = originalText;
        }
      }
    });
  </script>
</body>
</html>
